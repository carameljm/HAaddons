name: "TREK - Travel Planner"
version: "4.0.0"
slug: "trek"
description: "Self-hosted collaborative travel & trip planning platform for Home Assistant"
url: "https://github.com/liketrek/TREK"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
homeassistant_api: false
ingress: true
ingress_port: 3099
panel_icon: "mdi:airplane-takeoff"
panel_title: "TREK"
panel_admin: false
ports:
  3099/tcp: 3099
ports_description:
  3099/tcp: "Web Interface access (HTTP)"
map:
  - "share:rw"
  - "config:rw"
schema:
  admin_email: "str?"
  admin_password: "password?"
  encryption_key: "password?"
  tz: "str?"
  log_level: "list(debug|info|warn|error)?"
options:
  admin_email: ""
  admin_password: ""
  encryption_key: ""
  tz: "Europe/Brussels"
  log_level: "info"
