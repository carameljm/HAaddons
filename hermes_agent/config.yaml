name: "Hermes Agent (Windows Share)"
description: "Hermes Agent met automatische Windows Share (Samba) koppeling."
version: "1.2.1"
slug: "hermes_agent_windows"
init: false
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
ingress: true
ingress_port: 8099
panel_icon: "mdi:console-network"
panel_title: "Hermes Terminal"
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
options:
  api_server_enabled: true
  api_server_key: "change-me-local-dev"
schema:
  api_server_enabled: bool
  api_server_key: str
ports:
  8642/tcp: 8642
map:
  - share:rw
  - config:rw
