name: "Hermes Agent v3"
description: "Hermes Agent met Windows Share koppeling."
version: "1.3.3"
slug: "hermes_v3"
init: false
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
ingress: true
ingress_port: 8099
panel_icon: "mdi:console-network"
panel_title: "Hermes v3"
host_network: true
full_access: true
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
host_ipc: true
kernel_modules: true
options:
  api_server_enabled: true
  api_server_key: "change-me-local-dev"
  bind_source: "/share/hermes_windows/data"
  bind_target: "/data"
  extra_env: "HERMES_ALLOW_DANGEROUS_ROOT=1,HERMES_ALLOW_ROOT_GATEWAY=1,HERMES_GATEWAY_ENABLED=true"
schema:
  api_server_enabled: bool
  api_server_key: str
  bind_source: str
  bind_target: str
  extra_env: str
map:
  - share:rw
  - config:rw
  - addon_config:rw
